name: TypeScript application
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.10
        env:
          POSTGRES_USER: crozon
          POSTGRES_PASSWORD: crozon
          POSTGRES_DB: crozon_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U crozon -d crozon_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://crozon:crozon@localhost:5432/crozon_test
      MIGRATION_TEST_DATABASE_URL: postgres://crozon:crozon@localhost:5432/crozon_migration_test
      DATABASE_URL: postgres://crozon:crozon@localhost:5432/crozon_test
      APP_ORIGIN: http://localhost:3000
      MAIL_MODE: outbox
      PGPASSWORD: crozon
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - run: bun install --frozen-lockfile
      - run: bun audit
      - run: createdb -h localhost -U crozon crozon_migration_test
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - run: bun x playwright install --with-deps chromium
      - run: bun run db:migrate
      - run: bun run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 14
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: crozon:verify
          cache-from: type=gha
          cache-to: type=gha,mode=max
