name: Tests

on:
  push:
  pull_request:

env:
  CDN_URL: ${{ secrets.CDN_URL }}
  BUNNYCDN_API_KEY: ${{ secrets.BUNNYCDN_API_KEY }}
  BUNNYCDN_BUCKET: ${{ secrets.BUNNYCDN_BUCKET }}
  BUNNYCDN_REGION: ${{ secrets.BUNNYCDN_REGION }}
  EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
  GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
  GOOGLE_MAPS_API_URL: ${{ secrets.GOOGLE_MAPS_API_URL }}
  MAILER_DSN: ${{ secrets.MAILER_DSN }}
  STRIPE_PUBLIC_KEY: ${{ secrets.STRIPE_PUBLIC_KEY }}
  STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}

jobs:
  symfony-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, xml, ctype, iconv, intl, pdo_pgsql, dom, filter, gd, json, mbstring, pdo
          coverage: none
          tools: symfony-cli
      - uses: actions/checkout@v4
      - name: Copy .env.test.local
        run: php -r "file_exists('.env.test.local') || copy('.env.test', '.env.test.local');"
      - name: Cache Composer packages
        id: composer-cache
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-
      - name: Install Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
      - name: Execute tests (Unit and Feature tests) via PHPUnit
        run: vendor/bin/phpunit
      - name: Run php static analysis
        run: vendor/bin/phpstan analyse src tests --level 9

  npm-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Install modules
        run: npm install
      - name: Run tests
        run: npm run test

  playwright:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: symfony
          POSTGRES_PASSWORD: symfony
          POSTGRES_DB: app_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, xml, ctype, iconv, intl, pdo_pgsql, dom, filter, gd, json, mbstring, pdo
          coverage: none
          tools: symfony-cli

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Copy .env.test.local
        run: php -r "file_exists('.env.test.local') || copy('.env.test', '.env.test.local');"

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@v3
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Setup bun cache
        uses: actions/cache@v3
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install

      - name: Install Playwright Browsers
        run: bun x playwright install --with-deps

      - name: Build assets
        run: bun run build:dev

      - name: Create uploads directory for fixtures
        run: |
          # Create upload directories and ensure PHP can write to them
          mkdir -p public/uploads/rental
          # Create directory for current date (VichUploader uses Y/d/m format)
          YEAR=$(date +%Y)
          DAY=$(date +%d)
          MONTH=$(date +%m)
          mkdir -p "public/uploads/rental/$YEAR/$DAY/$MONTH"
          # Set full permissions on all created directories
          chmod -R 777 public/uploads

      - name: Create test database
        run: |
          symfony console doctrine:migrations:migrate --env=test --no-interaction
          symfony console doctrine:fixtures:load --group=data --env=test --no-interaction
          symfony console doctrine:fixtures:load --group=rental --append --env=test --no-interaction

      - name: Start Symfony server (test env)
        env:
          APP_ENV: test
        run: |
          symfony server:start --port=8000 --no-tls --daemon
          sleep 5

      - name: Run Playwright tests
        env:
          E2E_BASE_URL: http://localhost:8000
        run: bun test:e2e

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-screenshots
          path: test-results/
          retention-days: 30
