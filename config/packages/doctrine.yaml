doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
        mapping_types:
            rental_status: string
        types:
            bed_size: App\Doctrine\Types\BedSizeType
            rental_status: App\Doctrine\Types\RentalStatusType
            subscription_status: App\Doctrine\Types\SubscriptionStatusType
            discount_type: App\Doctrine\Types\DiscountTypeType
            price: App\Doctrine\Types\PriceType

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        #server_version: '13'
    orm:
        auto_generate_proxy_classes: true
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        auto_mapping: true
        mappings:
            App:
                is_bundle: false
                dir: '%kernel.project_dir%/src/Entity'
                prefix: 'App\Entity'
                alias: App
