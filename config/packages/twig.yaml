twig:
    default_path: '%kernel.project_dir%/templates'
    form_themes:
        - 'tailwind_2_layout.html.twig'
        - '_forms/layout.html.twig'

    globals:
        app_locale: '%kernel.default_locale%'
        gmaps_api_key: '%env(GOOGLE_MAPS_API_KEY)%'

when@test:
    twig:
        strict_variables: true
